[project]
name = "ollive-backend"
version = "0.1.0"
description = "Backend for the LLM inference logging and ingestion system"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.3.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Every top-level package under src/ - see
# aidlc-docs/inception/application-design/project-structure.md for what's
# shared (db, events) vs. unit-owned (provider, chat, ingestion, analytics,
# auth, api). Placeholders are near-empty until their unit lands.
packages = [
    "src/db",
    "src/events",
    "src/provider",
    "src/chat",
    "src/ingestion",
    "src/analytics",
    "src/auth",
    "src/api",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
