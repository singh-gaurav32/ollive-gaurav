[project]
name = "ollive-backend"
version = "0.1.0"
description = "Backend for the LLM inference logging and ingestion system"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.3.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Grows as each unit adds its own top-level package under src/.
packages = ["src/provider"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
