services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ollive
      POSTGRES_PASSWORD: ollive
      POSTGRES_DB: ollive
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollive -d ollive"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ollive:ollive@postgres:5432/ollive
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Plain HTTP locally (localhost:8080/8000, no TLS) - without this the
      # browser would silently refuse to store the Secure session cookie,
      # breaking login. Real deployments (k3s + cert-manager) are HTTPS and
      # don't set this, so they get the safer Secure-by-default behavior.
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
