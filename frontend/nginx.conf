server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend routes have no /api prefix (see backend/src/main.py router registration) -
    # proxy their exact path prefixes to the api service, everything else is the SPA.
    location ~ ^/(auth|conversations|metrics|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /conversations/{id}/messages streams the chat response chunk by chunk -
        # buffering would defeat the whole point of streaming.
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
